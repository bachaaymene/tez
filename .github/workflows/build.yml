name: Build thesis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: tez.tex
          pre_compile: ln -s . Thesis_ICD
          args: -pdf -f -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: tez.pdf
          if-no-files-found: error

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-log
          path: tez.log
          if-no-files-found: ignore
